name: Build Streamix BD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find ZIP
        id: zip
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Project
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Gradle Project
        id: project
        run: |
          PROJECT=$(find extracted -type f -name "gradlew" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: gradlew not found!"
            echo "Searching for Gradle files..."
            find extracted -type f \( -name "settings.gradle*" -o -name "build.gradle*" -o -name "gradle-wrapper.jar" \)
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x "${{ steps.project.outputs.project_dir }}/gradlew"

      - name: Check Gradle Project
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          echo "Project directory:"
          pwd
          echo ""
          echo "Project files:"
          ls -la
          echo ""
          echo "Gradle version:"
          ./gradlew --version

      - name: Build Debug APK
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find "${{ steps.project.outputs.project_dir }}" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-APK
          path: ${{ steps.apk.outputs.apk }}
