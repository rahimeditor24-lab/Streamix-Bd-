name: Build Streamix BD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find Project
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | head -100

          if [ -f "./gradlew" ]; then
            echo "Project found in root"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "./streamix-bd/gradlew" ]; then
            echo "Project found in streamix-bd"
            echo "PROJECT_DIR=./streamix-bd" >> "$GITHUB_ENV"
          else
            echo "ERROR: gradlew not found"
            exit 1
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ls -la gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean assembleDebug --no-daemon

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-debug
          path: |
            **/build/outputs/apk/debug/*.apk
