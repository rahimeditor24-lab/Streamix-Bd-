name: Build Streamix BD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract ZIP if present
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted
          else
            echo "No ZIP found."
            echo "Using repository files directly."
          fi

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # First check repository root
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          fi

          # If not found, search extracted files
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS_FILE=$(find extracted . \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -not -path "*/.git/*" \
              -not -path "*/build/*" \
              | head -n 1 || true)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo ""
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android Project
        run: |
          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."
            chmod +x ./gradlew
          else
            echo "Gradle wrapper not found."
            echo "Generating wrapper with Gradle 9.3.1..."
            gradle wrapper --gradle-version 9.3.1
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Gradle version:"
          ./gradlew --version

          echo ""
          echo "Cleaning project..."
          ./gradlew clean --no-daemon

          echo ""
          echo "Building Debug APK..."
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
